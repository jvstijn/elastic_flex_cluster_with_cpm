---
# imr-dod-vm reference stack — public TLS front door (nginx :443)
cpm_env_file: "{{ lookup('env', 'CPM_ENV_FILE') | default(playbook_dir + '/.env', true) }}"

elastic_usr: elastic
elastic_pw: "{{ lookup('ini', 'ELASTIC_PASSWORD type=properties file=' ~ cpm_env_file) }}"
kibana_password: "{{ lookup('ini', 'KIBANA_PASSWORD type=properties file=' ~ cpm_env_file) }}"

elastic_base_url: "https://central.kaposi.net"
kibana_url: "https://cpm.kaposi.net"
cpm_validate_certs: true

# Watchers run on es-central-01; webhook callbacks use docker DNS + port 9200
webhook_host: es-central-01
webhook_port: 9200

# Geen prefix: hier staat monitoring nog op es-central-01 zelf. Draait het daar
# straks op een eigen cluster, zet er dan "monitoring:" voor, anders lezen de
# ML-datafeeds de verkeerde index (de watchers gebruiken de alias al wel).
cpm_monitoring_index: ".monitoring-es-8-*"
cpm_ml_reinstall: false
cpm_clean_indices: false
cpm_datafeed_start: ""

# Data streams die buiten CPM-beheer blijven.
#
# Het patroon matcht tegen de topicnaam, en die is gelijk aan de naam van de
# data stream: <type>-<dataset>-<namespace>. Let op dat de kafka_topic_extension
# hier NIET in zit; die plakt de pipeline-manager er pas later achter.
#
# Er mag precies één sterretje in, en alleen de eerste telt. "*-v0*" doet dus
# niet wat je hoopt: dat wordt endsWith("-v0*") en matcht nooit iets. Staat -v0
# midden in de naam en varieert de namespace, dan is er per namespace een regel
# nodig. Het sterretje vooraan maakt zo'n regel wel meteen onafhankelijk van
# type en dataset: "*-v0-ns1" raakt logs, metrics en traces tegelijk.
#
# Komt er een namespace bij, voeg hier dan ook een regel toe. Opzoeken welke er
# in deze omgeving voorkomen:
#   GET cpm-pipeline-state/_search
#   {"size": 0, "aggs": {"ns": {"terms": {"field": "namespace", "size": 50}}}}
#
# Uitrollen: --tags exclusions, daarna de state-manager en de pipeline-manager
# draaien. De tag alleen verandert nog niets aan de Logstash-invoer.
cpm_stream_exclusions:
  # Alle streams met -v0 in de naam, één regel per namespace.
  # LET OP: alleen 'default' ingevuld. Vul aan met de namespaces die in
  # deze omgeving voorkomen, anders blijven die -v0 streams in beheer.
  - pattern: "*-v0-default"
    reason: "versie-0 streams blijven buiten CPM-beheer"
  # Bestaande stream met een eigen pipeline buiten CPM.
  - pattern: "logs-webapp-default"
    reason: "eigen pipeline buiten CPM"

# true maakt de inventory leidend: alles wat hier niet staat wordt verwijderd,
# ook exclusions die met scripts/cpm_exclude_stream.py zijn gemaakt.
cpm_stream_exclusions_prune: false

cpm_cluster_registry: "{{ lookup('file', playbook_dir + '/inventories/kaposi/files/cluster_registry.json') | from_json }}"
