server.name: kibana-acc
server.host: "0.0.0.0"
server.publicBaseUrl: "http://localhost:5602"

elasticsearch.hosts: ["https://es-acc-central:9200"]
elasticsearch.username: "kibana_system"
elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca/ca.crt"]

monitoring.ui.enabled: true
# Stack Monitoring leest uit het aparte monitoring-cluster; de data staat
# niet meer op es-acc-central.
monitoring.ui.elasticsearch.hosts: ["https://es-acc-monitoring:9200"]
monitoring.ui.elasticsearch.username: "kibana_system"
monitoring.ui.elasticsearch.password: "${KIBANA_PASSWORD}"
monitoring.ui.elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca/ca.crt"]

xpack.encryptedSavedObjects.encryptionKey: "b8c9d0e1f2a3456789012345678901bc"
